# devenv inputs
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-unstable
  uv2nix:
    url: github:pyproject-nix/uv2nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  pyproject-nix:
    url: github:pyproject-nix/pyproject.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  pyproject-build-systems:
    url: github:pyproject-nix/build-system-pkgs
    inputs:
      nixpkgs:
        follows: nixpkgs
