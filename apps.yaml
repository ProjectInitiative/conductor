# Conductor desired-state API baseline.
#
# The operator references existing homelab-owned Deployments. It does not own
# their pod templates. Temporary CLI/web intent belongs in WorkloadOverride CRs,
# never in this GitOps baseline.
downloaders:
  huggingface-cache-v1:
    image: registry.taildeab2.ts.net/homelab/model-cache-downloader:v1@sha256:dc82548802ddfd033f77ca44397ab9a937ae4dac556c00efd84ad2603925fc33
    imagePullPolicy: IfNotPresent
    metricsPort: 9105

# resourcePools: intentionally empty. The dgx-spark pool (and all workload
# intent) is owned by the homelab repo (llm-test/conductor-workloads, synced
# by the argocd-mc/conductor-workloads Application). Declaring it here too
# caused a dual-ownership fight: this pinned render kept re-applying
# managementMode: Observe (and previously desiredState: Resident on
# tensorfold-v14), pinning Conductor to observe-only and flip-flopping
# intents (2026-11-12 incident). Keep workloads + pools OUT of this file.
resourcePools: {}

managedWorkloads: {}
