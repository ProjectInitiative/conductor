# Conductor desired-state API baseline.
#
# The operator references existing homelab-owned Deployments. It does not own
# their pod templates. Temporary CLI/web intent belongs in WorkloadOverride CRs,
# never in this GitOps baseline.
#
# ResourcePool/ManagedWorkload policy is intentionally NOT declared here: it is
# homelab-owned (conductor-workloads Application) so Manage/Observe and workload
# membership changes do not require a Conductor code or image revision. Declaring
# the same objects in both Applications produced Argo SharedResourceWarnings with
# diverging specs (Observe/100 baseline vs Manage/0 homelab policy).
downloaders:
  huggingface-cache-v1:
    image: registry.taildeab2.ts.net/homelab/model-cache-downloader:v1@sha256:dc82548802ddfd033f77ca44397ab9a937ae4dac556c00efd84ad2603925fc33
    imagePullPolicy: IfNotPresent
    metricsPort: 9105
