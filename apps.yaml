# Conductor desired-state API baseline.
#
# The operator references existing homelab-owned Deployments. It does not own
# their pod templates. Temporary CLI/web intent belongs in WorkloadOverride CRs,
# never in this GitOps baseline.
resourcePools:
  dgx-spark:
    # Observe is the safe migration default. Promote to Manage only after the
    # controller's status/events match the live lane during failure injection.
    # Live recovery exercise: allow the controller to execute the persisted
    # head-first shutdown / worker-first startup plan against tensorfold-v14.
    managementMode: Manage
    capacity:
      slots: 1
    nodeSelector:
      ai-compute: "true"
      nvidia.com/gpu.present: "true"
    routing:
      serviceName: dgx-spark-backend
      selector:
        serving.homelab.io/alias: dgx-spark
    policy:
      notReadyGracePeriod: 2m
      requireFencing: true
      defaultMinDwell: 15m
      cooldown: 5m

  # Classifier redundancy is deliberately modeled as two independent pools:
  # AMD and NVIDIA have different node/resource contracts. The existing
  # cygnet-gate Service remains the routing front door; Conductor qualifies
  # each backend Service independently.
  cygnet-amd:
    managementMode: Observe
    capacity:
      slots: 1
    nodeSelector:
      kubernetes.io/hostname: astrolabe
    routing:
      serviceName: cygnet-classifier
      selector:
        app: cygnet-classifier
    policy:
      notReadyGracePeriod: 2m
      requireFencing: true
      defaultMinDwell: 15m
      cooldown: 5m

  cygnet-nvidia:
    managementMode: Observe
    capacity:
      slots: 1
    nodeSelector:
      kubernetes.io/hostname: chronometer
    routing:
      serviceName: cygnet-classifier-nv
      selector:
        app: cygnet-classifier-nv
    policy:
      notReadyGracePeriod: 2m
      requireFencing: true
      defaultMinDwell: 15m
      cooldown: 5m

managedWorkloads:
  cygnet-classifier-amd:
    poolRef: cygnet-amd
    desiredState: Resident
    priority: 50
    driver:
      type: DeploymentSet
      deploymentSet:
        members:
          - name: cygnet-classifier
            role: classifier
            startOrder: 10
            stopOrder: 10
            replicas: 1
            readyGate: DeploymentAvailable
    qualification:
      serviceName: cygnet-classifier
      path: /health
      port: 8009
      timeout: 10m
    routing:
      serviceName: cygnet-classifier
      selector:
        app: cygnet-classifier

  cygnet-classifier-nvidia:
    poolRef: cygnet-nvidia
    desiredState: Resident
    priority: 50
    driver:
      type: DeploymentSet
      deploymentSet:
        members:
          - name: cygnet-classifier-nv
            role: classifier
            startOrder: 10
            stopOrder: 10
            replicas: 1
            readyGate: DeploymentAvailable
    qualification:
      serviceName: cygnet-classifier-nv
      path: /health
      port: 8009
      timeout: 10m
    routing:
      serviceName: cygnet-classifier-nv
      selector:
        app: cygnet-classifier-nv

  tensorfold-v14:
    poolRef: dgx-spark
    desiredState: Resident
    priority: 100
    driver:
      type: DeploymentSet
      deploymentSet:
        recoveryPolicy: RecreateTogether
        members:
          - name: tensorfold-v14-worker
            role: worker
            startOrder: 10
            stopOrder: 20
            replicas: 1
            readyGate: ContainersRunning
          - name: tensorfold-v14-head
            role: head
            startOrder: 20
            stopOrder: 10
            replicas: 1
            readyGate: DeploymentAvailable
    qualification:
      serviceName: dgx-spark-backend
      path: /health
      timeout: 45m
    routing:
      serviceName: dgx-spark-backend
      selector:
        serving.homelab.io/alias: dgx-spark
