apiVersion: apps/v1
kind: Deployment
metadata:
  name: conductor
  namespace: llm-test
  labels:
    app: conductor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: conductor
  template:
    metadata:
      labels:
        app: conductor
    spec:
      serviceAccountName: conductor
      containers:
        - name: conductor
          image: ghcr.io/projectinitiative/conductor:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/conductor
            - server
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: state
              mountPath: /etc/conductor/state
              readOnly: true
            - name: profiles
              mountPath: /etc/conductor/profiles
              readOnly: true
      volumes:
        - name: state
          configMap:
            name: conductor-state
        - name: profiles
          configMap:
            name: conductor-model-profiles
---
apiVersion: v1
kind: Service
metadata:
  name: conductor
  namespace: llm-test
  labels:
    app: conductor
spec:
  selector:
    app: conductor
  ports:
    - name: http
      port: 8000
      targetPort: 8000
