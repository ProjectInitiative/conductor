# Fission container-executor environment for Conductor's surface functions.
# The Conductor image runs its multi-headed binary in "function" mode; the
# handler is path-dispatched (/status and /model-ready). One environment serves
# both function CRs. The conductor ServiceAccount provides in-cluster k8s action.
apiVersion: fission.io/v1
kind: Environment
metadata:
  name: conductor
  namespace: llm-test
spec:
  version: 3
  runtime:
    image: ghcr.io/projectinitiative/conductor:0.1.0
    container:
      command:
        - /bin/conductor
        - function
    podSpec:
      serviceAccountName: conductor
  defaultPoolSize: 1
  allowedFunctionsPerPod: 1
---
apiVersion: fission.io/v1
kind: Function
metadata:
  name: conductor-status
  namespace: llm-test
spec:
  environment: conductor
  invokeStrategy:
    strategy: newdeploy
    executionStrategy:
      minScale: 1
      maxScale: 1
---
apiVersion: fission.io/v1
kind: Function
metadata:
  name: conductor-model-ready
  namespace: llm-test
spec:
  environment: conductor
  invokeStrategy:
    strategy: newdeploy
    executionStrategy:
      minScale: 1
      maxScale: 1
---
apiVersion: fission.io/v1
kind: HTTPTrigger
metadata:
  name: conductor-status
  namespace: llm-test
spec:
  relativeURL: /conductor/status
  method: GET
  functionref:
    name: conductor-status
    type: function
---
# Fire when a model *-head Deployment becomes Ready, to finalize a swap.
apiVersion: fission.io/v1
kind: KubernetesWatchTrigger
metadata:
  name: conductor-model-ready
  namespace: llm-test
spec:
  namespace: llm-test
  type: deployment
  labelSelector: conductor.io/model
  functionref:
    name: conductor-model-ready
    type: function
