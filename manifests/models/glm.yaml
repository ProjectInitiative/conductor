# GLM head (rank 0). Default replicas:0. Full spec filled in later from the
# GLM-5.3-Flash-EXL3 model profile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-parity-head
  namespace: llm-test
  labels:
    app: glm-parity-head
    conductor.io/model: GLM-5.3-Flash-EXL3
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: glm-parity-head
  template:
    metadata:
      labels:
        app: glm-parity-head
        conductor.io/model: GLM-5.3-Flash-EXL3
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: chronometer
      containers:
        - name: vllm
          image: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args: ["exec /usr/local/bin/vllm serve Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw --host 0.0.0.0 --port 8888 --served-model-name GLM-5.3-Flash-EXL3"]
          ports:
            - name: http
              containerPort: 8888
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-parity-worker
  namespace: llm-test
  labels:
    app: glm-parity-worker
    conductor.io/model: GLM-5.3-Flash-EXL3
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: glm-parity-worker
  template:
    metadata:
      labels:
        app: glm-parity-worker
        conductor.io/model: GLM-5.3-Flash-EXL3
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: sextant
      containers:
        - name: vllm
          image: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args: ["sleep infinity"]
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
