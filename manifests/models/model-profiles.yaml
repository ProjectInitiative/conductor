apiVersion: v1
kind: ConfigMap
metadata:
  name: conductor-model-profiles
  namespace: llm-test
data:
  models.yaml: |
    models:
      - name: deepseek-v4-flash-vision-exp
        priority: 1
        image: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
        head:
          deployment: deepseek-parity-head
          hostIP: 172.16.4.55
          port: 8000
        worker:
          deployment: deepseek-parity-worker
          hostIP: 172.16.4.56
        health:
          path: /health
          timeout: 3600s
        quantum:
          max_requests: 32
          max_seconds: 600
        min_dwell: 900s
        cooldown: 300s
      - name: GLM-5.3-Flash-EXL3
        priority: 2
        image: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3
        head:
          deployment: glm-parity-head
          hostIP: 172.16.4.55
          port: 8888
        worker:
          deployment: glm-parity-worker
          hostIP: 172.16.4.56
        health:
          path: /health
          timeout: 3600s
        quantum:
          max_requests: 24
          max_seconds: 600
        min_dwell: 900s
        cooldown: 300s
      - name: qwen3.8-flash-next
        priority: 3
        image: vllm/vllm-openai:qwen38-flash-next
        head:
          deployment: qwen-parity-head
          hostIP: 172.16.4.55
          port: 8888
        worker:
          deployment: qwen-parity-worker
          hostIP: 172.16.4.56
        health:
          path: /health
          timeout: 1800s
        quantum:
          max_requests: 24
          max_seconds: 600
        min_dwell: 900s
        cooldown: 300s
