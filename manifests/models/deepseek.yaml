# DeepSeek head (rank 0, serves API). Default replicas:0 — the scheduler scales
# this up. Full serving spec (init container patch-staging, env profile, JIT
# caches) is filled in from the model profiles / homelab parity lane.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-parity-head
  namespace: llm-test
  labels:
    app: deepseek-parity-head
    conductor.io/model: deepseek-v4-flash-vision-exp
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deepseek-parity-head
  template:
    metadata:
      labels:
        app: deepseek-parity-head
        conductor.io/model: deepseek-v4-flash-vision-exp
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: chronometer
      containers:
        - name: vllm
          image: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args: ["exec /usr/local/bin/vllm serve deepseek-ai/DeepSeek-V4-Flash-Vision-Exp --host 0.0.0.0 --port 8000 --served-model-name deepseek-v4-flash-vision-exp"]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-parity-worker
  namespace: llm-test
  labels:
    app: deepseek-parity-worker
    conductor.io/model: deepseek-v4-flash-vision-exp
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deepseek-parity-worker
  template:
    metadata:
      labels:
        app: deepseek-parity-worker
        conductor.io/model: deepseek-v4-flash-vision-exp
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: sextant
      containers:
        - name: vllm
          image: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          # rank-1 worker: joins the head's MP distributed server on 172.16.4.55:25000.
          # Must match the head's --distributed-executor-backend / TP and master addr.
          args:
            - |
              set -a
              export MASTER_ADDR=172.16.4.55 MASTER_PORT=25000 NNODES=2 NODE_RANK=1 HEADLESS=1
              export VLLM_HOST_IP=172.16.4.56 WORKER_VLLM_HOST_IP=172.16.4.56
              export VLLM_HOST=0.0.0.0 VLLM_PORT=8000
              set +a
              exec /usr/local/bin/vllm serve deepseek-ai/DeepSeek-V4-Flash-Vision-Exp \
                --host 0.0.0.0 --port 8000 --served-model-name deepseek-v4-flash-vision-exp \
                --distributed-executor-backend mp --tensor-parallel-size 2 --pipeline-parallel-size 1 \
                --nnodes 2 --node-rank 1 --master-addr 172.16.4.55 --master-port 25000 --headless
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
