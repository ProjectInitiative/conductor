# Qwen head (rank 0). Default replicas:0. Full spec filled in later from the
# Qwen3.8-Flash-Next model profile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-parity-head
  namespace: llm-test
  labels:
    app: qwen-parity-head
    conductor.io/model: qwen3.8-flash-next
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen-parity-head
  template:
    metadata:
      labels:
        app: qwen-parity-head
        conductor.io/model: qwen3.8-flash-next
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: chronometer
      containers:
        - name: vllm
          image: vllm/vllm-openai:qwen38-flash-next
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args: ["exec /usr/local/bin/vllm serve RadixArk/Qwen3.8-Flash-Next-NVFP4 --host 0.0.0.0 --port 8888 --served-model-name qwen3.8-flash-next"]
          ports:
            - name: http
              containerPort: 8888
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-parity-worker
  namespace: llm-test
  labels:
    app: qwen-parity-worker
    conductor.io/model: qwen3.8-flash-next
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen-parity-worker
  template:
    metadata:
      labels:
        app: qwen-parity-worker
        conductor.io/model: qwen3.8-flash-next
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: sextant
      containers:
        - name: vllm
          image: vllm/vllm-openai:qwen38-flash-next
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          # rank-1 worker: joins the Qwen head's MP distributed server on 172.16.4.55:25000.
          # Must match the head's --distributed-executor-backend / TP and master addr.
          args:
            - |
              set -a
              export MASTER_ADDR=172.16.4.55 MASTER_PORT=25000 NNODES=2 NODE_RANK=1 HEADLESS=1
              export VLLM_HOST_IP=172.16.4.56 WORKER_VLLM_HOST_IP=172.16.4.56
              export VLLM_HOST=0.0.0.0 VLLM_PORT=8888
              set +a
              exec /usr/local/bin/vllm serve RadixArk/Qwen3.8-Flash-Next-NVFP4 \
                --host 0.0.0.0 --port 8888 --served-model-name qwen3.8-flash-next \
                --distributed-executor-backend mp --tensor-parallel-size 2 --enable-expert-parallel \
                --nnodes 2 --node-rank 1 --master-addr 172.16.4.55 --master-port 25000 --headless
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
