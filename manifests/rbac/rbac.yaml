apiVersion: v1
kind: ServiceAccount
metadata:
  name: conductor
  namespace: llm-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conductor
  namespace: llm-test
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: conductor
  namespace: llm-test
subjects:
  - kind: ServiceAccount
    name: conductor
    namespace: llm-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: conductor
