# DeepSeek head/worker Services for the resident model's API + startup probe.
apiVersion: v1
kind: Service
metadata:
  name: deepseek-head
  namespace: llm-test
spec:
  selector:
    app: deepseek-parity-head
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: deepseek-worker
  namespace: llm-test
spec:
  selector:
    app: deepseek-parity-worker
  ports:
    - name: startup
      protocol: TCP
      port: 9090
      targetPort: 9090
