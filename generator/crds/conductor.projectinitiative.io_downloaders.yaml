apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: downloaders.conductor.projectinitiative.io
spec:
  group: conductor.projectinitiative.io
  names:
    kind: DownloaderClass
    listKind: DownloaderClassList
    plural: downloaders
    singular: downloader
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                imagePullPolicy:
                  type: string
                  enum:
                    - IfNotPresent
                    - Always
                    - Never
                  default: IfNotPresent
                serviceAccountName:
                  type: string
                metricsPort:
                  type: integer
                  format: int32
                  minimum: 0
            status:
              type: object
      subresources:
        status: {}
