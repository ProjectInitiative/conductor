[project]
name = "conductor-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cdk8s>=2.0.0",
    "constructs>=10.0.0",
    "jsii>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
dev-dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
