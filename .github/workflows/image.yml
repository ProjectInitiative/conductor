name: Multi-architecture image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scheduler/go.mod
          cache-dependency-path: scheduler/go.sum
      - uses: astral-sh/setup-uv@v6
      - name: Test Go operator
        working-directory: scheduler
        run: CGO_ENABLED=0 go test ./...
      - name: Test cdk8s generator
        run: uv run --project generator --extra dev pytest -q generator/tests
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/projectinitiative/conductor
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=0.2.0,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
