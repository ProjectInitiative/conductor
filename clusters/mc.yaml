name: mc
server: https://172.16.1.50:6443
project: conductor
argoNamespace: argocd-mc
# ONE self-contained app. The generator renders the whole stack into this
# namespace; Argo CD applies it via the cdk8s-v1.0 CMP plugin.
apps:
  - name: conductor
    namespace: llm-test
    repoURL: https://github.com/projectinitiative/conductor.git
    targetRevision: HEAD
    # CI publishes this tag as one OCI index for linux/amd64 + linux/arm64.
    # Pin the resulting digest before changing ResourcePool to Manage.
    # d61efef includes priority arbitration and fail-closed fencing evidence.
    image: ghcr.io/projectinitiative/conductor:sha-d61efef@sha256:04f30f5492e6f04ee3d769df071a032a6447fd44f40b2d8dc56e3e52c230d28b
