name: mc
server: https://172.16.1.50:6443
project: conductor
argoNamespace: argocd-mc
# ONE control-plane app. It installs Conductor into the existing llm-test
# namespace but deliberately does not own that Namespace: manual experiment
# lanes share it and must survive Application deletion or pruning.
apps:
  - name: conductor
    namespace: llm-test
    manageNamespace: false
    repoURL: https://github.com/projectinitiative/conductor.git
    targetRevision: HEAD
    # Immutable multi-architecture index (linux/amd64 + linux/arm64), built
    # from 3421ef1. Keep ResourcePool in Observe until failure tests pass.
    image: ghcr.io/projectinitiative/conductor@sha256:1f2771564902c03b90a77aa4efb13f8cf45b7919d4cd7d7ff4a167dfd0737e04
