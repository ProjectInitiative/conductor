    # Pin the resulting digest before changing ResourcePool to Manage.
    image: ghcr.io/projectinitiative/conductor:0.3.0@sha256:26a5a1bb73f03ebd6a0541eefbea7c3f6b996d489c79b8fbdf7bb5c94b0bd6e7
